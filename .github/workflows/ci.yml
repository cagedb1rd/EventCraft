name: quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies and CJK fonts
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e '.[dev]' --no-deps
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: ruff check eventcraft scripts tests
      - run: python scripts/validate_skill.py
      - run: python scripts/release_check.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Offline campaign smoke
        run: eventcraft all examples/inputs/lecture.json --auto-style --output output/ci-smoke
      - name: Build distributable
        run: |
          python -m build
          python scripts/package_skill.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-and-smoke
          path: |
            test-results.xml
            output/ci-smoke/
            output/ci-diagnostics/
            dist/
