[build-system]
requires = ["setuptools>=75,<83", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "eventcraft"
version = "1.0.0"
description = "Offline event campaign creation with ten design systems and explainable style selection"
requires-python = ">=3.11"
license = "MIT"
readme = "README.en.md"
dependencies = ["pydantic>=2.10,<3", "playwright>=1.50,<2", "pillow>=11,<13", "pypdf>=5,<7", "python-docx>=1.1,<2", "qrcode[pil]>=8,<9", "tzdata>=2025"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2", "pyyaml>=6,<7", "opencv-python-headless>=4.10,<5"]
ocr = ["pytesseract>=0.3.13,<1"]

[project.scripts]
eventcraft = "eventcraft.cli:main"

[tool.setuptools.packages.find]
include = ["eventcraft*"]

[tool.setuptools.package-data]
eventcraft = ["data/*.json", "data/*.css"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: real Chromium integration and layout checks"]
